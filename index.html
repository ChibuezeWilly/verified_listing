<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VerifyProp — Find Property. Verify Information. Make Better Decisions.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F1;
  --paper-alt:#ECEEE6;
  --panel:#FFFFFF;
  --ink:#132039;
  --ink-soft:#57647A;
  --ink-faint:#8993A4;
  --line:#DADDD1;
  --line-strong:#C3C7B9;
  --green:#1F7A4D;
  --green-soft:#E3F0E7;
  --gold:#B8862E;
  --gold-soft:#F5EAD3;
  --rust:#B4531F;
  --rust-soft:#F6E7DB;
  --red:#A3342A;
  --red-soft:#F5E2DF;
  --grey:#6B7280;
  --grey-soft:#EAEBE6;
  --serif:'Fraunces', Georgia, serif;
  --sans:'IBM Plex Sans', -apple-system, sans-serif;
  --mono:'IBM Plex Mono', 'Courier New', monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; margin:0 0 .4em; color:var(--ink); letter-spacing:-0.01em;}
h1{font-size:clamp(2rem,4vw,3.1rem); font-weight:600; line-height:1.06;}
h2{font-size:clamp(1.5rem,2.6vw,2.1rem); line-height:1.15;}
h3{font-size:1.25rem;}
p{margin:0 0 1em;}
a{color:inherit; text-decoration:none;}
button{font-family:var(--sans); cursor:pointer;}
input,select,textarea{font-family:var(--sans); font-size:.95rem;}
::selection{background:var(--gold-soft);}
.container{max-width:1180px; margin:0 auto; padding:0 24px;}
.mono{font-family:var(--mono);}

/* ---------- Nav ---------- */
.topbar{background:var(--ink); color:#DDE3EE; font-size:12.5px;}
.topbar .container{display:flex; justify-content:space-between; align-items:center; padding:6px 24px; gap:12px; flex-wrap:wrap;}
.topbar a{color:#DDE3EE; opacity:.85;}
.topbar a:hover{opacity:1; text-decoration:underline;}
nav.mainnav{background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:40;}
nav.mainnav .container{display:flex; align-items:center; justify-content:space-between; padding:14px 24px; gap:20px;}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-weight:600; font-size:1.35rem; flex-shrink:0;}
.brand .mark{width:30px; height:30px; border:2px solid var(--ink); border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative;}
.brand .mark::after{content:''; width:8px; height:14px; border-right:2.5px solid var(--green); border-bottom:2.5px solid var(--green); transform:rotate(45deg) translate(-1px,-2px);}
.navlinks{display:flex; gap:22px; flex-wrap:wrap; font-size:14px; font-weight:500;}
.navlinks a{color:var(--ink-soft); padding:4px 0; border-bottom:2px solid transparent;}
.navlinks a:hover, .navlinks a.active{color:var(--ink); border-bottom-color:var(--green);}
.navright{display:flex; align-items:center; gap:10px;}
select#roleSwitch{border:1px solid var(--line-strong); background:var(--paper-alt); padding:7px 10px; font-size:12.5px; border-radius:3px; color:var(--ink);}
.btn{display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:3px; font-size:14px; font-weight:600; border:1px solid transparent; white-space:nowrap;}
.btn-primary{background:var(--ink); color:#fff;}
.btn-primary:hover{background:#0A1626;}
.btn-outline{background:transparent; border:1px solid var(--ink); color:var(--ink);}
.btn-outline:hover{background:var(--ink); color:#fff;}
.btn-green{background:var(--green); color:#fff;}
.btn-green:hover{background:#175f3c;}
.btn-sm{padding:6px 11px; font-size:12.5px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.hamburger{display:none; align-items:center; justify-content:center; font-size:1.25rem; line-height:1; width:42px; height:38px; padding:0;}
.mobile-menu,.mobile-menu-backdrop{display:none;}
@media(max-width:980px){
  nav.mainnav .container{padding:11px 18px;}
  .navright{gap:8px;}
  .navright #roleSwitch,.navright > a{display:none;}
  .navlinks{display:none;}
  .hamburger{display:inline-flex; background:none; border:1px solid var(--line-strong); border-radius:3px;}
  .mobile-menu-backdrop{position:fixed; inset:0; display:block; background:rgba(19,32,57,.42); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:49;}
  .mobile-menu{display:flex; flex-direction:column; position:fixed; z-index:50; top:0; right:0; bottom:0; width:min(88vw,360px); padding:18px 20px 24px; background:var(--panel); box-shadow:-10px 0 30px rgba(19,32,57,.16); transform:translateX(100%); transition:transform .22s ease; overflow-y:auto;}
  body.menu-open{overflow:hidden;}
  body.menu-open .mobile-menu{transform:translateX(0);}
  body.menu-open .mobile-menu-backdrop{opacity:1; pointer-events:auto;}
  .mobile-menu-head{display:flex; align-items:center; justify-content:space-between; padding-bottom:18px; border-bottom:1px solid var(--line);}
  .mobile-menu-close{width:36px; height:36px; border:1px solid var(--line-strong); border-radius:3px; background:var(--paper-alt); color:var(--ink); font-size:1.35rem; line-height:1;}
  .mobile-menu-links{display:flex; flex-direction:column; padding:14px 0; border-bottom:1px solid var(--line);}
  .mobile-menu-links a{padding:11px 0; color:var(--ink-soft); font-weight:500; border-bottom:1px solid var(--line);}
  .mobile-menu-links a:last-child{border-bottom:0;}
  .mobile-menu-links a.active{color:var(--green); font-weight:700;}
  .mobile-menu-utility{display:flex; flex-wrap:wrap; gap:12px 20px; padding:16px 0; font-size:13px; color:var(--ink-soft); border-bottom:1px solid var(--line);}
  .mobile-menu-account{display:flex; flex-direction:column; gap:10px; padding-top:18px;}
  .mobile-menu-account #mobileRoleSwitch{width:100%; padding:10px;}
  .mobile-menu-account .btn{justify-content:center; width:100%;}
}

/* ---------- Hero / sections ---------- */
.hero{padding:56px 0 40px; border-bottom:1px solid var(--line);}
.hero-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:center;}
.hero-grid > *{min-width:0;}
.hero h1,.hero .lede{overflow-wrap:break-word;}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;}}
@media(max-width:640px){
  .container{padding-left:18px; padding-right:18px;}
  .hero{padding:38px 0 30px;}
  .hero h1{font-size:clamp(1.85rem,9vw,2.5rem);}
  .hero .lede{font-size:1rem;}
}
.eyebrow-tag{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--green); border:1px solid var(--green); border-radius:3px; padding:4px 10px; margin-bottom:18px;}
.lede{font-size:1.08rem; color:var(--ink-soft); max-width:52ch;}
.hero-actions{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap;}
.hero-stats{display:flex; gap:0; margin-top:34px; border-top:1px solid var(--line);}
.hero-stats div{flex:1; padding:16px 18px 0; border-right:1px solid var(--line);}
.hero-stats div:last-child{border-right:none;}
.hero-stats .num{font-family:var(--serif); font-size:1.7rem; font-weight:600;}
.hero-stats .lab{font-size:12px; color:var(--ink-faint);}

.searchcard{background:var(--panel); border:1px solid var(--line-strong); border-radius:6px; padding:22px; box-shadow:0 1px 0 var(--line);}
.tabs{display:flex; border-bottom:1px solid var(--line); margin-bottom:16px;}
.tabs button{background:none; border:none; padding:10px 4px; margin-right:22px; font-weight:600; font-size:14px; color:var(--ink-faint); border-bottom:2px solid transparent;}
.tabs button.active{color:var(--ink); border-bottom-color:var(--ink);}
.field-row{display:flex; gap:10px; flex-wrap:wrap;}
.field{flex:1; min-width:120px; display:flex; flex-direction:column; gap:4px;}
.field label{font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:600;}
.field input, .field select{padding:9px 10px; border:1px solid var(--line-strong); border-radius:3px; background:var(--paper);}

section.block{padding:52px 0; border-bottom:1px solid var(--line);}
.block-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:26px; gap:20px; flex-wrap:wrap;}
.block-head p{color:var(--ink-soft); margin:0; max-width:60ch;}

/* ---------- Cards ---------- */
.grid{display:grid; gap:22px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-3,.grid-4,.grid-2{grid-template-columns:1fr;}}

.pcard{background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden; display:flex; flex-direction:column; transition:border-color .15s, transform .15s;}
.pcard:hover{border-color:var(--line-strong); transform:translateY(-2px);}
.pcard .img{height:150px; background:linear-gradient(135deg,#DCE3D4,#C9D2C1); display:flex; align-items:center; justify-content:center; color:#6B7A63; font-size:12px; font-weight:600; position:relative;}
.pcard .img .idtag{position:absolute; top:8px; left:8px; background:rgba(19,32,57,.85); color:#fff; font-family:var(--mono); font-size:10.5px; padding:3px 6px; border-radius:2px;}
.pcard .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1;}
.pcard .price{font-family:var(--serif); font-weight:600; font-size:1.2rem;}
.pcard .loc{color:var(--ink-soft); font-size:13.5px;}
.pcard .meta{display:flex; gap:10px; font-size:12.5px; color:var(--ink-faint);}
.pcard .foot{display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:10px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-faint);}

.status-tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:2px; letter-spacing:.01em; border:1px solid;}
.status-tag::before{content:''; width:7px; height:7px; border-radius:50%; display:inline-block;}
.st-verified{color:var(--green); border-color:var(--green); background:var(--green-soft);}
.st-verified::before{background:var(--green);}
.st-progress{color:var(--gold); border-color:var(--gold); background:var(--gold-soft);}
.st-progress::before{background:var(--gold);}
.st-unverified{color:var(--grey); border-color:var(--line-strong); background:var(--grey-soft);}
.st-unverified::before{background:var(--grey);}
.st-review{color:var(--rust); border-color:var(--rust); background:var(--rust-soft);}
.st-review::before{background:var(--rust);}
.st-rejected{color:var(--red); border-color:var(--red); background:var(--red-soft);}
.st-rejected::before{background:var(--red);}
.st-expired{color:var(--ink-faint); border-color:var(--line-strong); background:var(--grey-soft);}
.st-expired::before{background:var(--ink-faint);}

/* ---------- Process steps ---------- */
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.steps{grid-template-columns:1fr;}}
.step{border-top:2px solid var(--ink); padding-top:12px;}
.step .n{font-family:var(--mono); font-size:12px; color:var(--ink-faint);}

/* ---------- Footer ---------- */
footer{background:var(--ink); color:#C7CEDB; padding:48px 0 24px; margin-top:0;}
footer .grid-4{gap:30px;}
footer h4{color:#fff; font-size:13px; text-transform:uppercase; letter-spacing:.05em; font-family:var(--sans); font-weight:600;}
footer a{color:#AEB8CC; display:block; margin-bottom:8px; font-size:13.5px;}
footer a:hover{color:#fff;}
.footbar{border-top:1px solid #2A3852; margin-top:32px; padding-top:18px; font-size:12.5px; color:#8794AD; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

/* ---------- Generic page bits ---------- */
.pagehead{padding:36px 0 24px; border-bottom:1px solid var(--line);}
.crumb{font-size:12.5px; color:var(--ink-faint); margin-bottom:10px;}
.crumb a:hover{text-decoration:underline;}
.two-col{display:grid; grid-template-columns:2fr 1fr; gap:36px; align-items:start;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:20px;}
.panel + .panel{margin-top:18px;}
.checklist-item{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line);}
.checklist-item:last-child{border-bottom:none;}
.check-dot{width:20px; height:20px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; margin-top:1px;}
.check-dot.done{background:var(--green); color:#fff;}
.check-dot.pending{border:1.5px dashed var(--line-strong); color:transparent;}
.hist-item{padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
.hist-item:last-child{border-bottom:none;}
.hist-item .date{color:var(--ink-faint); font-size:12px; font-family:var(--mono);}
.idplate{display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-weight:600; letter-spacing:.03em; border:1.5px solid var(--ink); padding:6px 10px; border-radius:3px; background:var(--paper-alt); font-size:13px;}
.disclaimer{font-size:12.5px; color:var(--ink-faint); background:var(--paper-alt); border-left:3px solid var(--gold); padding:12px 14px; border-radius:0 3px 3px 0;}
.badge-mini{font-size:11px; padding:2px 7px; border-radius:2px; background:var(--paper-alt); border:1px solid var(--line-strong); color:var(--ink-soft); font-weight:600;}
table.data{width:100%; border-collapse:collapse; font-size:13.5px;}
table.data th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); border-bottom:1px solid var(--line-strong); padding:8px 10px; font-weight:600;}
table.data td{padding:9px 10px; border-bottom:1px solid var(--line);}
table.data tr:hover td{background:var(--paper-alt);}
.formgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:640px){.formgrid{grid-template-columns:1fr;}}
.formfield{display:flex; flex-direction:column; gap:5px;}
.formfield label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.formfield input,.formfield select,.formfield textarea{padding:9px 11px; border:1px solid var(--line-strong); border-radius:3px; background:#fff;}
.formfield.full{grid-column:1/-1;}
.metric-row{display:grid; grid-template-columns:repeat(6,1fr); gap:14px;}
@media(max-width:980px){.metric-row{grid-template-columns:repeat(3,1fr);}}
@media(max-width:560px){.metric-row{grid-template-columns:repeat(2,1fr);}}
.metric{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 16px;}
.metric .num{font-family:var(--serif); font-size:1.6rem; font-weight:600;}
.metric .lab{font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em;}
.tab-strip{display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:20px;}
.tab-strip button{background:none; border:none; padding:9px 14px; font-size:13px; font-weight:600; color:var(--ink-faint); border-bottom:2px solid transparent; border-radius:3px 3px 0 0;}
.tab-strip button.active{color:var(--ink); border-bottom-color:var(--green); background:var(--paper-alt);}
.dash-shell{display:grid; grid-template-columns:220px 1fr; gap:0; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--panel);}
@media(max-width:900px){.dash-shell{grid-template-columns:1fr;}}
.dash-side{background:var(--paper-alt); border-right:1px solid var(--line); padding:16px 0;}
.dash-side button{display:block; width:100%; text-align:left; background:none; border:none; padding:10px 20px; font-size:13.5px; font-weight:500; color:var(--ink-soft);}
.dash-side button.active{color:var(--ink); font-weight:700; background:#fff; border-right:3px solid var(--green); margin-right:-1px;}
.dash-side button:hover{color:var(--ink);}
.dash-main{padding:26px 28px;}
.wizard-steps{display:flex; gap:4px; margin-bottom:22px; flex-wrap:wrap;}
.wizard-steps span{font-size:11px; padding:5px 9px; border-radius:2px; background:var(--paper-alt); border:1px solid var(--line); color:var(--ink-faint); font-weight:600;}
.wizard-steps span.wdone{background:var(--green-soft); border-color:var(--green); color:var(--green);}
.wizard-steps span.wcur{background:var(--ink); border-color:var(--ink); color:#fff;}
.progress-track{height:8px; background:var(--paper-alt); border-radius:4px; overflow:hidden; border:1px solid var(--line);}
.progress-fill{height:100%; background:var(--green);}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border:1px solid var(--line); border-radius:4px; margin-bottom:8px; background:var(--paper-alt);}
.toggle-row.on{background:var(--green-soft); border-color:var(--green);}
.switch{width:38px; height:21px; border-radius:12px; background:var(--line-strong); position:relative; flex-shrink:0; border:none;}
.switch.on{background:var(--green);}
.switch::after{content:''; width:16px; height:16px; background:#fff; border-radius:50%; position:absolute; top:2px; left:2px; transition:.15s;}
.switch.on::after{left:19px;}
.certificate{border:2px solid var(--ink); border-radius:8px; padding:26px; background:repeating-linear-gradient(135deg,#fff,#fff 24px,#FAFAF6 24px,#FAFAF6 48px); position:relative;}
.certificate .seal{position:absolute; top:20px; right:24px; width:64px; height:64px; border:2px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:11px; color:var(--gold); font-weight:700; text-align:center; line-height:1.15;}
.qr-box{width:150px; height:150px; border:1px solid var(--line-strong); padding:6px; background:#fff; border-radius:4px;}
.qr-box img{width:100%; height:100%;}
.alert{padding:12px 14px; border-radius:4px; font-size:13.5px; margin-bottom:14px;}
.alert-warn{background:var(--rust-soft); color:var(--rust); border:1px solid var(--rust);}
.alert-ok{background:var(--green-soft); color:var(--green); border:1px solid var(--green);}
.alert-info{background:var(--gold-soft); color:#8a6820; border:1px solid var(--gold);}
.pill-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{font-size:12px; padding:5px 10px; border:1px solid var(--line-strong); border-radius:20px; background:var(--paper-alt); color:var(--ink-soft); cursor:pointer;}
.chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.access-gate{max-width:520px; margin:60px auto; text-align:center; padding:40px 30px; border:1px dashed var(--line-strong); border-radius:8px; background:var(--panel);}
.doc-lock{display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--paper-alt); border:1px solid var(--line); border-radius:4px; font-size:13px; color:var(--ink-faint);}
.avatar{width:44px; height:44px; border-radius:50%; background:var(--paper-alt); border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:600; color:var(--ink-soft); flex-shrink:0;}
.prof-card{display:flex; gap:14px; padding:16px; border:1px solid var(--line); border-radius:6px; background:var(--panel);}
.sim-note{font-size:11.5px; color:var(--ink-faint); font-style:italic;}
::placeholder{color:#A9AFA0;}
.link-btn{background:none;border:none;color:var(--green);font-weight:600;font-size:inherit;padding:0;}
.link-btn:hover{text-decoration:underline;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   VERIFYPROP — front-end demo application
   Single-file SPA simulating the full MVP: property listing, structured
   verification workflow, Property IDs, certificates, QR public verification,
   RBAC-gated dashboards, duplicate flags, reporting, and audit logging.
   All data is mocked and stored in localStorage — this file has no backend.
   ========================================================================= */

const LS_KEY = 'verifyprop_demo_v1';

const CHECK_DEFS = [
  {key:'physicalInspection', label:'Physical inspection', step:1, desc:'Surveyor physically visited and inspected the property.'},
  {key:'locationConfirmed', label:'Location confirmed', step:1, desc:'Address and coordinates match the physical site.'},
  {key:'ownerIdentity', label:'Owner / instructor identity checked', step:2, desc:'Identity of the owner or instructing party was confirmed.'},
  {key:'authorityToMarket', label:'Authority to market confirmed', step:3, desc:'Instructing party has authority to market/let this property.'},
  {key:'descriptionChecked', label:'Property description checked', step:4, desc:'Listing description matches what was observed on site.'},
  {key:'priceConfirmed', label:'Price confirmed', step:4, desc:'Asking price confirmed with the instructing party.'},
  {key:'occupancyChecked', label:'Occupancy checked', step:4, desc:'Current occupancy status was confirmed.'},
  {key:'documentsReviewed', label:'Supporting / title documents reviewed', step:5, desc:'Available documents were reviewed by the professional.'},
  {key:'encumbranceCheck', label:'Encumbrance / dispute check', step:6, desc:'Checked for known disputes or encumbrances where information is available.'},
  {key:'duplicateCheck', label:'Duplicate listing check', step:6, desc:'Checked the platform for existing listings of this property.'},
];
const STEP_LABELS = ['Property Identity','Owner Information','Authority to Market','Property Information','Documentation','Risk Checks','Professional Review','Verification Record','Verification Certificate'];

function loadState(){
  let raw = localStorage.getItem(LS_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  const data = seedData();
  const st = {...data, role:'Public Visitor', route:'#/home'};
  localStorage.setItem(LS_KEY, JSON.stringify(st));
  return st;
}
let STATE = loadState();
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }
function resetDemo(){ localStorage.removeItem(LS_KEY); STATE = loadState(); render(); }

/* ---------- helpers ---------- */
function money(n){ if(n===0) return '—'; return '₦' + n.toLocaleString('en-NG'); }
function statusClass(s){
  return {'Verified':'st-verified','Verification in Progress':'st-progress','Unverified':'st-unverified','Needs Review':'st-review','Rejected':'st-rejected','Expired':'st-expired'}[s] || 'st-unverified';
}
function firmName(id){ const f = STATE.firms.find(f=>f.id===id); return f? f.name : '—'; }
function profById(id){ return STATE.professionals.find(p=>p.id===id); }
function propByPid(pid){ return STATE.properties.find(p=>p.propertyId.toLowerCase()===pid.toLowerCase()); }
function checksCompleted(p){ return CHECK_DEFS.filter(c=>p.checks[c.key].completed).length; }
function nextPropertyId(area){
  const code = AREA_CODES[area] || 'LAG';
  const year = 2026;
  const existing = STATE.properties.filter(p=>p.propertyId.includes('-'+code+'-'+year+'-')).length;
  const seq = String(482 + existing + 1).padStart(5,'0');
  return `LAG-${code}-${year}-${seq}`;
}
function nextVerificationId(){
  const existing = STATE.properties.filter(p=>p.verificationId).length;
  return `VER-2026-${String(931+existing+1).padStart(5,'0')}`;
}
function logAudit(user, action, entity, entityId, prev, next){
  STATE.auditLogs.unshift({id:'A'+(STATE.auditLogs.length+1), user, action, entity, entityId, prev, next, ts:new Date().toISOString().slice(0,16).replace('T',' ')});
}
function qrImg(text, size){ return `https://api.qrserver.com/v1/create-qr-code/?size=${size||150}x${size||150}&data=${encodeURIComponent(text)}`; }
function go(route){ location.hash = route; }
function esc(s){ return (s||'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- ROLE ACCESS ---------- */
const ROLES = ['Public Visitor','Property Seeker','Property Owner','Estate Surveyor/Valuer','Firm Administrator','Platform Administrator','Regulatory Reviewer'];
function requireRole(routeName, roles){
  if(!roles.includes(STATE.role)){
    return `<div class="access-gate">
      <div class="eyebrow-tag" style="border-color:var(--rust);color:var(--rust);">Restricted area</div>
      <h3>This ${routeName} requires a different role</h3>
      <p style="color:var(--ink-soft)">In production this is enforced with real authentication and server-side authorization. For this demo, switch roles from the selector in the top navigation to preview this area.</p>
      <p class="sim-note">Needs one of: ${roles.join(', ')} — you are currently viewing as ${STATE.role}.</p>

  }
  return null;
}

function openWizard(pid){ WIZ_PROPERTY = pid; WIZ_STEP = 1; render(); setTimeout(()=>document.getElementById('wizAnchor')?.scrollIntoView({behavior:'smooth'}),50); }
function renderWizard(){
  const p = STATE.properties.find(x=>x.id===WIZ_PROPERTY);
  if(!p) return '';
  const done = checksCompleted(p);
  const mandatoryDone = done === CHECK_DEFS.length;
  const stepChecks = CHECK_DEFS.filter(c=>c.step===WIZ_STEP);
  return `<div id="wizAnchor" class="panel" style="border-color:var(--ink);">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div><h3 style="margin-bottom:2px;">Verification workflow — ${p.propertyId}</h3><p style="color:var(--ink-soft); margin:0; font-size:13.5px;">${p.title}</p></div>
      <span class="badge-mini">${done} of ${CHECK_DEFS.length} checks completed</span>
    </div>
    <div class="progress-track" style="margin:14px 0;"><div class="progress-fill" style="width:${done/CHECK_DEFS.length*100}%;"></div></div>
    <div class="wizard-steps">
      ${STEP_LABELS.map((s,i)=>`<span class="${i+1<WIZ_STEP?'wdone':(i+1===WIZ_STEP?'wcur':'')}" onclick="WIZ_STEP=${i+1};render();" style="cursor:pointer;">${i+1}. ${s}</span>`).join('')}
    </div>

    ${WIZ_STEP<=6 ? `
      <h4 style="font-size:.95rem;">Step ${WIZ_STEP}: ${STEP_LABELS[WIZ_STEP-1]}</h4>
      ${stepChecks.length ? stepChecks.map(c=>{
        const on = p.checks[c.key].completed;
        return `<div class="toggle-row ${on?'on':''}">
          <div><div style="font-weight:600; font-size:14px;">${c.label}</div><div style="font-size:12px; color:var(--ink-faint);">${c.desc}</div></div>
          <button class="switch ${on?'on':''}" onclick="toggleCheck('${p.id}','${c.key}')"></button>
        </div>`;
      }).join('') : `<p class="sim-note">Property Identity is auto-recorded when the Property ID was issued.</p>`}
      <div style="display:flex; justify-content:space-between; margin-top:16px;">
        <button class="btn btn-outline btn-sm" ${WIZ_STEP===1?'disabled':''} onclick="WIZ_STEP=${WIZ_STEP-1};render();">← Back</button>
        <button class="btn btn-primary btn-sm" onclick="WIZ_STEP=${WIZ_STEP+1};render();">Next step →</button>
      </div>
    ` : ''}

    ${WIZ_STEP===7 ? `
      <h4 style="font-size:.95rem;">Step 7: Professional Review</h4>
      ${mandatoryDone ? `<div class="alert alert-ok">All 10 mandatory checks are complete. Confirm your professional review below to proceed.</div>` : `<div class="alert alert-warn">${done} of ${CHECK_DEFS.length} checks completed. All mandatory checks must be complete before professional review can be confirmed.</div>`}
      <label style="display:flex; gap:10px; align-items:flex-start; font-size:14px; margin:12px 0;">
        <input type="checkbox" id="reviewConfirm" ${!mandatoryDone?'disabled':''} style="margin-top:3px;">
        I confirm I have personally reviewed all completed checks for ${p.propertyId} and they are accurate to the best of my professional judgement.
      </label>
      <div style="display:flex; justify-content:space-between;">
        <button class="btn btn-outline btn-sm" onclick="WIZ_STEP=6;render();">← Back</button>
        <button class="btn btn-primary btn-sm" ${!mandatoryDone?'disabled':''} onclick="confirmReview('${p.id}')">Confirm review →</button>
      </div>
    ` : ''}

    ${WIZ_STEP===8 ? `
      <h4 style="font-size:.95rem;">Step 8: Verification Record</h4>
      ${p.verificationId ? `
        <div class="alert alert-ok">Verification Record ${p.verificationId} created for ${p.propertyId}.</div>
        <div class="grid grid-2">
          <div><div class="badge-mini">VERIFICATION ID</div><div class="mono" style="margin-top:4px;">${p.verificationId}</div></div>
          <div><div class="badge-mini">DATE</div><div style="margin-top:4px;">${p.verificationDate}</div></div>
        </div>
        <button class="btn btn-primary btn-sm" style="margin-top:14px;" onclick="WIZ_STEP=9;render();">Continue to certificate →</button>
      ` : `<p class="sim-note">Complete the professional review in Step 7 first.</p><button class="btn btn-outline btn-sm" onclick="WIZ_STEP=7;render();">← Back</button>`}
    ` : ''}

    ${WIZ_STEP===9 ? `
      <h4 style="font-size:.95rem;">Step 9: Verification Certificate</h4>
      ${p.status==='Verified' ? `
        <div class="alert alert-ok">Certificate issued with QR code for public verification.</div>
        <a href="#/certificate/${p.id}" class="btn btn-primary btn-sm">View certificate</a>
      ` : `<p class="sim-note">Certificate becomes available once the verification record is created in Step 8.</p>`}
    ` : ''}

    <div style="margin-top:18px; padding-top:14px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;">
      <button class="btn btn-outline btn-sm" onclick="rejectProperty('${p.id}')">Reject verification</button>
      <button class="btn btn-outline btn-sm" onclick="flagForReview('${p.id}')">Flag: Needs Review</button>
    </div>
  </div>`;
}
function toggleCheck(pid, key){
  const p = STATE.properties.find(x=>x.id===pid);
  const wasOn = p.checks[key].completed;
  p.checks[key].completed = !wasOn;
  p.checks[key].date = !wasOn ? new Date().toISOString().slice(0,10) : null;
  if(!wasOn){
    p.history.push({date:new Date().toISOString().slice(0,10), event:'Check completed: '+CHECK_DEFS.find(c=>c.key===key).label});
    logAudit(STATE.role,'Verification check completed','VerificationCheck', p.propertyId+' / '+key, 'Incomplete','Complete');
  }
  if(p.status==='Unverified') p.status='Verification in Progress';
  save(); render();
}
function confirmReview(pid){
  const box = document.getElementById('reviewConfirm');
  if(!box || !box.checked){ alert('Please tick the confirmation before proceeding.'); return; }
  WIZ_STEP = 8; render();
  setTimeout(()=>{
    const p = STATE.properties.find(x=>x.id===pid);
    if(!p.verificationId){
      p.verificationId = nextVerificationId();
      p.verificationDate = new Date().toISOString().slice(0,10);
      p.status = 'Verified';
      p.history.push({date:p.verificationDate, event:'Verification approved — certificate issued'});
      logAudit(STATE.role,'Verification approved','VerificationRecord', p.propertyId, 'Verification in Progress','Verified');
      save(); render();
    }
  }, 250);
}
function rejectProperty(pid){
  const p = STATE.properties.find(x=>x.id===pid);
  const reason = prompt('Reason for rejecting this verification:','Instructing party could not establish authority to market.');
  if(reason===null) return;
  p.status='Rejected';
  p.history.push({date:new Date().toISOString().slice(0,10), event:'Verification rejected — '+reason});
  logAudit(STATE.role,'Verification rejected','VerificationRecord', p.propertyId, 'Verification in Progress','Rejected');
  save(); WIZ_PROPERTY=null; render();
}
function flagForReview(pid){
  const p = STATE.properties.find(x=>x.id===pid);
  p.status='Needs Review';
  p.history.push({date:new Date().toISOString().slice(0,10), event:'Flagged for regulatory review'});
  logAudit(STATE.role,'Property flagged','Property', p.propertyId, 'Verification in Progress','Needs Review');
  save(); WIZ_PROPERTY=null; render();
}

/* =========================================================================
   PAGE: REGULATORY REVIEWER
   ========================================================================= */
function pageRegulatory(){
  const gate = requireRole('dashboard', ['Regulatory Reviewer']); if(gate) return gate;
  const review = STATE.properties.filter(p=>p.status==='Needs Review');
  return `<div class="container" style="padding:24px;">
    <h1 style="font-size:1.6rem;">Regulatory Review</h1>
    <p style="color:var(--ink-soft);">Read-only oversight of properties flagged for review, verification records, and audit history.</p>
    <div class="panel"><h3>Properties needing review</h3><table class="data"><thead><tr><th>Property ID</th><th>Title</th><th>Flagged reason</th></tr></thead><tbody>
      ${review.map(p=>`<tr><td class="mono">${p.propertyId}</td><td><a href="#/property/${p.id}" class="link-btn">${p.title}</a></td><td>${p.history[p.history.length-1].event}</td></tr>`).join('') || '<tr><td colspan="3">No properties currently need review.</td></tr>'}

    <div class="panel"><h3>Audit trail (latest)</h3>${auditTable(8)}</div>

/* =========================================================================
   PAGE: PLATFORM ADMIN
   ========================================================================= */
let ADMIN_SECTION = 'overview';
function pageAdmin(){
  const gate = requireRole('dashboard', ['Platform Administrator']); if(gate) return gate;
  const sections = ['overview','Users','Professionals','Firms','Properties','Verification Requests','Verification Records','Duplicate Listings','Reports','Verification Rules','Audit Logs','Analytics','Platform Settings'];
  return `<div class="container" style="padding:24px;">
    <h1 style="font-size:1.6rem; margin-bottom:16px;">Platform Administration</h1>
    <div class="dash-shell">
      <div class="dash-side">${sections.map(s=>`<button class="${ADMIN_SECTION===s?'active':''}" onclick="setAdminSection('${s}')">${s==='overview'?'Overview':s}</button>`).join('')}</div>
      <div class="dash-main">${renderAdminSection()}</div>
    </div>
  </div>`;
}
function setAdminSection(s){ ADMIN_SECTION=s; render(); }
function auditTable(limit){
  const rows = STATE.auditLogs.slice(0, limit||STATE.auditLogs.length);
  return `<table class="data"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Prev → New</th></tr></thead><tbody>
    ${rows.map(a=>`<tr><td class="mono">${a.ts}</td><td>${a.user}</td><td>${a.action}</td><td class="mono">${a.entityId}</td><td>${a.prev} → ${a.next}</td></tr>`).join('')}
  </tbody></table>`;
}
function renderAdminSection(){
  const props = STATE.properties;
  const byStatus = s=>props.filter(p=>p.status===s).length;
  switch(ADMIN_SECTION){
    case 'overview': return `
      <div class="metric-row">
        <div class="metric"><div class="num">${props.length}</div><div class="lab">Total Properties</div></div>
        <div class="metric"><div class="num">${byStatus('Verified')}</div><div class="lab">Verified</div></div>
        <div class="metric"><div class="num">${byStatus('Verification in Progress')}</div><div class="lab">Pending Verification</div></div>
        <div class="metric"><div class="num">${byStatus('Unverified')}</div><div class="lab">Unverified</div></div>
        <div class="metric"><div class="num">${byStatus('Expired')}</div><div class="lab">Expired</div></div>
        <div class="metric"><div class="num">${STATE.reports.length}</div><div class="lab">Reported Listings</div></div>
      </div>
      <div class="panel" style="margin-top:20px;"><h3>Recent audit activity</h3>${auditTable(6)}</div>
    `;
    case 'Users': return `<h3>Users</h3><table class="data"><thead><tr><th>Name</th><th>Role</th></tr></thead><tbody>${STATE.users.map(u=>`<tr><td>${u.name}</td><td>${u.role}</td></tr>`).join('')}</tbody></table>`;
    case 'Professionals': return `<h3>Professionals</h3><table class="data"><thead><tr><th>Name</th><th>Firm</th><th>License</th><th>Verifications</th></tr></thead><tbody>${STATE.professionals.map(p=>`<tr><td>${p.name}</td><td>${firmName(p.firmId)}</td><td class="mono">${p.licenseNo}</td><td>${p.verifiedCount}</td></tr>`).join('')}</tbody></table>`;
    case 'Firms': return `<h3>Firms</h3><table class="data"><thead><tr><th>Firm</th><th>Reg. No</th><th>Address</th></tr></thead><tbody>${STATE.firms.map(f=>`<tr><td>${f.name}</td><td class="mono">${f.regNo}</td><td>${f.address}</td></tr>`).join('')}</tbody></table>`;
    case 'Properties': return `<h3>All Properties</h3><table class="data"><thead><tr><th>Property ID</th><th>Title</th><th>Area</th><th>Status</th></tr></thead><tbody>${props.map(p=>`<tr><td class="mono">${p.propertyId}</td><td><a href="#/property/${p.id}" class="link-btn">${p.title}</a></td><td>${p.area}</td><td><span class="status-tag ${statusClass(p.status)}">${p.status}</span></td></tr>`).join('')}</tbody></table>`;
    case 'Verification Requests': return `<h3>Verification Requests</h3><table class="data"><thead><tr><th>Property ID</th><th>Assigned to</th><th>Progress</th></tr></thead><tbody>${props.filter(p=>p.status==='Verification in Progress'||p.status==='Unverified').map(p=>`<tr><td class="mono">${p.propertyId}</td><td>${p.professionalId?profById(p.professionalId).name:'Unassigned'}</td><td>${checksCompleted(p)}/${CHECK_DEFS.length}</td></tr>`).join('')}</tbody></table>`;
    case 'Verification Records': return `<h3>Verification Records</h3><table class="data"><thead><tr><th>Verification ID</th><th>Property ID</th><th>Professional</th><th>Date</th></tr></thead><tbody>${props.filter(p=>p.verificationId).map(p=>`<tr><td class="mono">${p.verificationId}</td><td class="mono">${p.propertyId}</td><td>${profById(p.professionalId).name}</td><td>${p.verificationDate}</td></tr>`).join('')}</tbody></table>`;
    case 'Duplicate Listings': return `<h3>Duplicate Listings</h3>${STATE.duplicateFlags.map(d=>`<div class="panel"><span class="badge-mini">${d.status}</span><p><strong>${d.propertyIds.join(' vs ')}</strong></p><p style="color:var(--ink-soft);">${d.reason}</p><div style="display:flex; gap:8px;"><button class="btn btn-outline btn-sm" onclick="resolveDuplicate('${d.id}','Confirmed duplicate')">Mark confirmed duplicate</button><button class="btn btn-outline btn-sm" onclick="resolveDuplicate('${d.id}','Not a duplicate')">Dismiss</button></div></div>`).join('') || '<p>No duplicate flags.</p>'}`;
    case 'Reports': return `<h3>Reports</h3><table class="data"><thead><tr><th>Property ID</th><th>Reason</th><th>Status</th><th>Date</th></tr></thead><tbody>${STATE.reports.map(r=>`<tr><td class="mono">${r.propertyId}</td><td>${r.reason}</td><td>${r.status}</td><td>${r.date}</td></tr>`).join('')}</tbody></table>`;
    case 'Verification Rules': return `<h3>Verification Rules</h3><p style="color:var(--ink-soft);">The 10 mandatory checks required before a property can become Verified. Editable here by Platform Administrators in the full system.</p>${CHECK_DEFS.map(c=>`<div class="checklist-item"><div class="check-dot pending" style="border-style:solid;">${c.step}</div><div style="font-weight:600;">${c.label}</div></div>`).join('')}`;
    case 'Audit Logs': return `<h3>Audit Logs</h3>${auditTable()}`;
    case 'Analytics': return `<h3>Analytics</h3><div class="metric-row"><div class="metric"><div class="num">${Math.round(byStatus('Verified')/props.length*100)}%</div><div class="lab">Verification rate</div></div><div class="metric"><div class="num">${STATE.reports.length}</div><div class="lab">Total reports</div></div><div class="metric"><div class="num">${STATE.duplicateFlags.length}</div><div class="lab">Duplicate flags</div></div></div>`;
    case 'Platform Settings': return `<h3>Platform Settings</h3><div class="panel"><div class="formfield" style="margin-bottom:12px;"><label>Verification validity period (months)</label><input value="12"></div><div class="formfield"><label>Mandatory checks required to verify</label><input value="10" disabled></div></div>`;
    default: return '';
  }
}
function resolveDuplicate(id, outcome){
  const d = STATE.duplicateFlags.find(x=>x.id===id);
  d.status = outcome;
  logAudit(STATE.role,'Property flagged','DuplicateFlag', id, 'Under review', outcome);
  save(); render();
}

/* =========================================================================
   ROUTER
   ========================================================================= */
function parseHash(){
  let h = location.hash || '#/home';
  h = h.slice(1); // drop '#'
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const qp = {};
  if(qs) qs.split('&').forEach(kv=>{ const [k,v]=kv.split('='); qp[k]=decodeURIComponent(v||''); });
  return {parts, qp};
}
function switchRole(role){ STATE.role = role; save(); render(); }
function toggleMobileMenu(open){
  document.body.classList.toggle('menu-open', open);
  const button = document.querySelector('.hamburger');
  if(button) button.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function render(){
  const {parts, qp} = parseHash();
  const r = parts[0] || 'home';
  let routeName = r, html = '';
  if(r==='home') html = pageHome();
  else if(r==='search') html = pageSearch(qp);
  else if(r==='property') html = pagePropertyDetail(parts[1]);
  else if(r==='verify') html = pageVerify(qp);
  else if(r==='certificate') html = pageCertificate(parts[1]);
  else if(r==='professionals') html = pageProfessionals();
  else if(r==='professional') html = pageProfessionalProfile(parts[1]);
  else if(r==='how-it-works') html = pageHowItWorks();
  else if(r==='safety') html = pageSafety();
  else if(r==='about') html = pageAbout();
  else if(r==='contact') html = pageContact();
  else if(r==='report') html = pageReport(qp);
  else if(r==='login') html = pageLogin();
  else if(r==='register') html = pageRegister();
  else if(r==='owner-dashboard') html = pageOwnerDashboard();
  else if(r==='pro-dashboard') html = pageProDashboard();
  else if(r==='firm-dashboard') html = pageFirmDashboard();
  else if(r==='regulatory') html = pageRegulatory();
  else if(r==='admin') html = pageAdmin();
  else { routeName='home'; html = pageHome(); }

  document.getElementById('app').innerHTML = layout(routeName, html);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
window.switchRole = switchRole;
window.go = go;
window.toggleMobileMenu = toggleMobileMenu;
window.resetDemo = resetDemo;
window.toggleSubmitForm = toggleSubmitForm;
window.submitNewProperty = submitNewProperty;
window.submitReport = submitReport;
window.setProSection = setProSection;
window.openWizard = openWizard;
window.toggleCheck = toggleCheck;
window.confirmReview = confirmReview;
window.rejectProperty = rejectProperty;
window.flagForReview = flagForReview;
window.setAdminSection = setAdminSection;
window.resolveDuplicate = resolveDuplicate;
render();
</script>
